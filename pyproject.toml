# Purpose: Package metadata and CLI registration for pairwise corpus operations.
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="jev-pairs"
version="0.1.0"
description="Blocked, cascaded pairwise deduplication, clustering, linking and contradiction detection."
requires-python=">=3.11"
license={text="MIT"}
authors=[{name="Guillaume Besse"}]
dependencies=[]
[project.scripts]
jev-pairs="jev_pairs.cli:main"
[tool.setuptools.packages.find]
where=["src"]
